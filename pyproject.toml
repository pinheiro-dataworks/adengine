[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adengine"
version = "0.1.0"
description = "AdEngine — marketing analytics: propensity, RFM segmentation, media metrics and budget optimization on Online Retail II"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "plotly>=5.22",
    "streamlit>=1.36",
    "scipy>=1.13",
    "lifetimes>=0.11.3",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
