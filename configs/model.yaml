# Modeling configuration — single source of truth for the global seed.
random_state: 42

segmentation:
  k_range: [2, 10]
  # Silhouette peaks at K=2 (0.424) — it just isolates one-time buyers from
  # everyone else, which has no marketing action attached to it. K=5 sits at
  # a local silhouette peak (0.342, tied with K=6) right where the inertia
  # elbow flattens, and produces the five classic RFM tiers (Champions /
  # Loyal / Potential Loyalists / At Risk / Hibernating) each with a
  # distinct recommended action — the business-interpretability tie-break
  # the scope doc calls for. See docs/adr/006-segmentation-k-selection.md.
  chosen_k: 5
  stability:
    n_runs: 20
    n_bootstrap: 50
    bootstrap_frac: 0.8
    ari_acceptance_threshold: 0.85

propensity:
  logistic:
    class_weight: "balanced"
    max_iter: 1000
  hist_gbm:
    max_iter: 300
    early_stopping: true
    validation_fraction: 0.15
    learning_rate: 0.08
    max_depth: 6
    l2_regularization: 0.1
  calibration:
    method: "isotonic"
    cv: 5
  permutation_importance:
    n_repeats: 15
    scoring: "roc_auc"

uplift:
  exposure_flag_col: "exposed"

metrics:
  ltv_horizon_months: 12
  gross_margin: 0.55     # used by the heuristic LTV fallback (ticket x freq x margin x horizon)

simulator:
  total_budget: 50000
  bootstrap_resamples: 200
  channel_bounds_pct:
    min: 0.05
    max: 0.70
  hill_shape_default: 1.3
  optimizer:
    method: "SLSQP"
    multistart_points: 10
